<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конструктор чекапа · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* v2 — по макету Figma «Mars clinic» (node 2-894): кремовый фон, белые карточки, navy-остров заказа, оранжевый акцент.
   Всё выровнено по одной сетке: общий левый край у заголовка, карточек и логотипа; общая ось у текста и кнопок на интро. */
:root{
  --bg:#f7f3ef; --card:#ffffff; --cream:#f6efe8; --cream-2:#efe6dc;
  --hover-shadow:0 30px 70px -18px rgba(150,96,52,.14),0 8px 24px -12px rgba(150,96,52,.08);
  --ink:#2f3448; --muted:#6b6f7d; --faint:#9a9daa; --line:#ebe5de;
  --navy:#203f8c; --navy-2:#18326f; --blue:#2c4fa3;
  --orange:#ff7a00; --orange-2:#ff9230;
  --ok:#00a69c; --ok-soft:#e5f6f5; --warn:#b45309; --warn-soft:#fff1e5; --err:#e84355;
  --f-ui:Gilroy,"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:clamp(16px,3.4vw,56px);   /* внешнее поле страницы */
  --pad:clamp(20px,2.4vw,40px);   /* внутреннее поле карточек */
  --gap:18px;                     /* расстояние между карточками */
  --r:28px; --r-lg:40px;
  --spring:cubic-bezier(.32,1.42,.52,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.mono{font-variant-numeric:tabular-nums;font-weight:600}

.wrap{max-width:calc(1600px + 2 * var(--gut));margin:0 auto;padding:clamp(28px,4vw,72px) max(var(--gut),env(safe-area-inset-right,0px)) 120px max(var(--gut),env(safe-area-inset-left,0px))}

/* ---------- logo ---------- */
.logo{display:inline-flex;flex-direction:column;gap:6px;width:150px;flex:none}
.logo-word{width:102px;margin-left:35px;display:block}
.logo-mars{width:150px;display:block}
.logo .lw{fill:#595959}.logo .lb{fill:var(--blue)}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:999px;font-size:15px;color:var(--faint);font-weight:500;white-space:nowrap;transition:background .3s,color .3s}
.st b{font-weight:500;min-width:10px;text-align:center;display:grid;place-items:center}
.st b svg{width:13px;height:13px;color:var(--ok)}
.st.done{color:var(--muted)}
.st.cur{color:var(--ink);font-weight:700;background:var(--card)}
.st.cur b{color:var(--orange);font-weight:600}

/* ---------- page head (шаги 1–4) ---------- */
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px 32px;margin-bottom:clamp(28px,3.4vw,64px)}
.phead h2{font-size:clamp(28px,2.6vw,42px);line-height:1.1;font-weight:700;letter-spacing:-.03em}
.phead p{margin:10px 0 0;color:var(--muted);font-size:17px}
.page-foot{margin-top:clamp(40px,4vw,72px)}
body.intro #flowHead,body.intro .page-foot{display:none}
@media (max-width:860px){ .phead{grid-template-columns:minmax(0,1fr)} .phead .stepper{order:-1;margin-left:-16px} }

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,24vw,413px);gap:var(--gap);align-items:stretch}
.grid.solo{grid-template-columns:minmax(0,1fr)}
.grid.solo .aside{display:none}
.stage{min-width:0}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (max-width:1100px){ .grid{grid-template-columns:minmax(0,1fr)} .aside{display:none} }

/* ================= INTRO ================= */
.hero{position:relative;background:var(--card);border-radius:var(--r-lg);min-height:clamp(620px,calc(100svh - 160px),800px);display:grid;grid-template-rows:auto 1fr;isolation:isolate}
.hero-head{position:relative;z-index:1;display:flex;align-items:center;gap:clamp(32px,5vw,96px);padding:56px var(--pad-x) 52px;--pad-x:clamp(24px,5vw,80px)}
.hero-head::after{content:"";position:absolute;left:var(--pad-x);right:0;bottom:0;height:1px;background:var(--line)}
.hero-head .stepper{gap:4px}
.hero-head .st{padding:0 12px;height:34px}
.hero-head .st.cur{background:none}
.hero-body{position:relative;z-index:3;display:grid;grid-template-columns:minmax(0,46%) 1fr;padding:0 0 0 clamp(24px,5vw,80px)}
.hero-copy{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:48px 0 64px}
.eyebrow{color:var(--muted);font-size:17px;font-weight:500}
.h1{font-size:clamp(34px,3.1vw,54px);line-height:1.04;font-weight:700;letter-spacing:-.02em;text-transform:uppercase}
.h1 em{font-style:normal;color:var(--orange)}
.lead{margin:0;color:var(--ink);opacity:.82;font-size:clamp(17px,1.2vw,21px);line-height:1.4;max-width:30em}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:672px;margin-top:34px}
.who-btn{position:relative;height:96px;border:0;border-radius:999px;background:var(--cream);display:grid;align-items:center;overflow:visible;isolation:isolate;transition:background .3s var(--ease),transform .45s var(--spring),box-shadow .3s}
.who-btn .t{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.who-btn .t b{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:25px;white-space:nowrap}
.who-btn .t small{font-size:15px;color:var(--muted);margin-top:2px;white-space:nowrap}
/* иконка одного размера и на одной высоте в обеих кнопках, зеркально по краям */
.who-btn .icw{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:1}
.who-btn .ic{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;transition:transform .5s var(--spring)}
.who-btn .rot{flex:none;display:block}
.who-btn .crop{display:block;position:relative;overflow:hidden}
.who-btn .crop img{position:absolute;max-width:none;display:block}
/* геометрия 1:1 из Figma (кнопка 330×96) */
.who-m .ic{left:-10px;top:9px;width:127.47px;height:153.63px}
.who-m .rot{transform:rotate(-11.18deg)}
.who-m .crop{width:103px;height:136.25px}
.who-m .crop img{left:-44.49%;top:-21.09%;width:185.07%;height:139.91%}
.who-f .ic{right:8.6px;top:-55px;width:118.4px;height:146.64px}
.who-f .rot{transform:rotate(-20.31deg)}
.who-f .crop{width:79.23px;height:127.04px}
.who-f .crop img{inset:0;width:100%;height:100%}
.who-m{grid-template-columns:110px 1fr;padding:0 28px 0 0}

.who-m .t{grid-column:2}
.who-f{grid-template-columns:1fr 110px;padding:0 0 0 28px}

.who-f .t{grid-column:1}
.who-btn:hover{background:var(--cream-2);transform:translateY(-2px);box-shadow:var(--hover-shadow)}
.who-m:hover .ic{transform:translateY(-4px) rotate(6deg)}
.who-f:hover .ic{transform:translateY(-4px) rotate(-6deg)}
.who-btn:active{transform:scale(.98)}
.skip{margin-top:6px;background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;padding:4px}
.skip:hover{color:var(--ink)}
/* фото: прижато к правому и нижнему краю карточки, голова выходит за верхний край */
.hero-ph{position:absolute;z-index:2;right:0;bottom:0;top:-16%;width:57%;overflow:hidden;border-bottom-right-radius:var(--r-lg);pointer-events:none}
.hero-ph img{position:absolute;right:0;bottom:-2%;width:100%;max-width:none;aspect-ratio:1;object-fit:cover;object-position:right bottom}
.hero-facts{margin:22px 0 0;text-align:center;color:var(--muted);font-size:15px}
.hero-facts .pr{color:var(--warn)}
@media (max-width:1100px){
  .hero{min-height:0;grid-template-rows:auto auto auto;margin-top:0}
  .hero-head{flex-wrap:wrap;gap:16px 32px;padding-block:32px 28px}
  .hero-body{grid-template-columns:minmax(0,1fr);padding:0 clamp(16px,4vw,48px)}
  .hero-copy{padding:36px 0 32px}
  .hero-ph{position:relative;top:auto;width:100%;height:clamp(300px,52vw,520px);border-radius:0 0 var(--r-lg) var(--r-lg)}
  .hero-ph img{left:50%;right:auto;translate:-50% 0;width:min(100%,640px);bottom:0}
}
@media (max-width:640px){
  .hero{border-radius:28px}
  .hero-head .st:not(.cur) span{display:none}
  .hero-head .st{padding:0 8px}
  .pick{grid-template-columns:1fr;margin-top:18px}
  .who-btn{height:80px}
  .who-m{grid-template-columns:90px 1fr}.who-f{grid-template-columns:1fr 90px}
}

/* ================= PROGRAMS ================= */
/* subgrid: название, цена, шкала, счётчики, список и ссылка стоят на одной линии во всех трёх карточках */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap);row-gap:0}
.pcard{position:relative;grid-row:span 6;display:grid;grid-template-rows:subgrid;background:var(--card);border-radius:var(--r);padding:var(--pad);border:2px solid transparent;cursor:pointer;transition:border-color .25s,box-shadow .3s,transform .4s var(--spring)}
.pcard:hover{box-shadow:var(--hover-shadow)}
.pcard.sel{border-color:var(--navy)}
.pcard h3{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pcard .desc{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.price{padding-top:30px;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(28px,2.1vw,36px);letter-spacing:-.02em;line-height:1.1;align-self:end}
.meter{margin-top:18px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--orange);transition:width .8s var(--spring)}
.counts{margin:16px 0 0;color:var(--muted);font-size:15px}
.counts b{color:var(--ink);font-weight:700}
.hl{list-style:none;margin:26px 0 0;padding:22px 0 0;border-top:1px dashed var(--line);display:grid;gap:8px;align-content:start;font-size:15.5px}
.hl .plus{color:var(--muted);font-size:14px}
.p-link{justify-self:start;margin-top:26px;display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;font-size:16px;font-weight:700;color:var(--blue)}
.p-link svg{width:18px;height:18px;transition:transform .35s var(--spring)}
.p-link:hover svg{transform:translateX(4px)}
@media (max-width:860px){ .cards{grid-template-columns:minmax(0,1fr);row-gap:var(--gap)} .pcard{grid-row:auto;grid-template-rows:none} }

/* ---------- compare (мобильная версия) ---------- */
.compare{margin-top:var(--gap);background:var(--card);border-radius:var(--r);overflow:hidden}
.compare summary{list-style:none;cursor:pointer;padding:18px var(--pad);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.compare summary::-webkit-details-marker{display:none}
.compare summary svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.compare[open] summary svg{transform:rotate(180deg)}
.cmp-tools,.cmp-toggle{padding:0 var(--pad) 12px;display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.cmp-toggle{padding:0;margin:14px 0}
.tbl-wrap{overflow:auto;max-height:520px;border-top:1px solid var(--line)}
.sheet-tbl{max-height:none;border:0}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--card);z-index:1;font-weight:700}
td.g{background:var(--bg);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.yes{color:var(--ok)}.no{color:var(--line)}.yes svg{width:16px;height:16px}
@media (min-width:1101px){ #cmp{display:none} }

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 20px;font-weight:600;font-size:16px;transition:transform .3s var(--spring),background .2s,opacity .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-dark{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-dark:hover{background:var(--orange-2);border-color:var(--orange-2)}
.btn-lg{padding:8px 8px 8px 28px;min-height:64px;font-size:17px;justify-content:space-between}
.btn-lg svg{width:34px;height:34px;padding:9px;border-radius:50%;background:rgba(255,255,255,.2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.nav .hint{color:var(--muted);font-size:15px}
.nav.docked{display:none}

/* ================= ISLAND (Ваш заказ) ================= */
.aside{min-width:0}
.aside-in{position:sticky;top:20px;display:flex;flex-direction:column;gap:var(--gap)}
body.s1 .aside-in{height:100%}
.aside-note:empty{display:none}
.aside-note .resolve{margin-top:0}
.island{display:flex;flex-direction:column;background:linear-gradient(170deg,#24479a,var(--navy) 55%,var(--navy-2));color:#fff;border-radius:var(--r);padding:var(--pad) 0 0;min-height:100%;overflow:hidden}
body:not(.s1) .island{min-height:0}
.island > *{padding-inline:var(--pad)}
.island h4{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.88);display:flex;justify-content:space-between;margin-bottom:16px}
.island h4 span:last-child{color:rgba(255,255,255,.55);letter-spacing:0;text-transform:none;font-weight:500}
.lines{display:grid;gap:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:15.5px;animation:lineIn .5s var(--spring) both}
.line small{display:block;color:rgba(255,255,255,.6);font-size:13.5px}
.line .mono{white-space:nowrap}
@keyframes lineIn{from{opacity:0;transform:translateY(8px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.empty{background:rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;font-size:15.5px;line-height:1.5}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.total>span:first-child{color:rgba(255,255,255,.7);font-size:15px}
.total .roll{font-size:32px}
.isl-note{margin-top:22px;font-size:13.5px;color:rgba(255,255,255,.66);line-height:1.5}
.isl-sp{flex:1;min-height:32px}
.isl-actions{display:grid;grid-template-columns:auto 1fr;gap:20px;padding-bottom:var(--pad)}
.isl-actions:empty{display:none}
.isl-actions .btn{min-height:64px}
.isl-actions .btn-ghost{grid-column:1;grid-row:1;border:1px solid rgba(255,255,255,.4);color:#fff;padding:0 24px}
.isl-actions .btn-ghost:hover{background:rgba(255,255,255,.08)}
.isl-actions .btn-dark{grid-column:2;grid-row:1;padding:8px 10px 8px 30px}
.isl-actions .btn-dark:only-child{grid-column:1 / -1}
.isl-foot{border-top:1px solid rgba(255,255,255,.14);padding-block:22px 26px}
.isl-foot:empty{display:none}
.isl-foot button{background:none;border:0;padding:0;color:#fff;font-size:16px;font-weight:500;display:inline-flex;gap:10px;align-items:center}
.isl-foot svg{width:16px;height:16px;transition:transform .35s var(--spring)}
.isl-foot button:hover svg{transform:translateX(4px)}

.roll{display:inline-flex;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em;line-height:1}

/* ================= ADDONS ================= */
.levelbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.levelbar .lbl{font-size:15px;color:var(--muted)}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:999px;padding:4px;max-width:100%}
.seg button{border:0;background:none;padding:9px 18px;border-radius:999px;font-size:15.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg-ink{position:absolute;inset:4px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--navy);border-radius:999px;pointer-events:none;transition:clip-path .55s var(--spring)}
.seg-ink span{display:grid;place-items:center;padding:9px 18px;font-size:15.5px;font-weight:600;color:#fff;white-space:nowrap}
@media (max-width:440px){ .seg button,.seg-ink span{padding:8px 10px;font-size:14.5px} }
.block{margin-top:34px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.block-h h3{font-size:20px;font-weight:700}
.block-h span{font-size:15px;color:var(--muted)}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--gap)}
.acards.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.acard{position:relative;text-align:left;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .25s,box-shadow .3s}
.acard:hover{box-shadow:var(--hover-shadow)}
.acard.on{border-color:var(--navy)}
.acard b{font-size:18px;display:block;padding-right:52px}
.acard p{margin:4px 0 0;color:var(--muted);font-size:15px}
.acard .ic{width:44px;height:44px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--orange)}
.acard .ic svg{width:20px;height:20px}
.acard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.acard .ap{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.acard .ap.muted{color:var(--muted);font-weight:500;font-size:14px}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:15px}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}
.sw{position:absolute;top:24px;right:24px;width:44px;height:26px;border-radius:999px;background:var(--line);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.on .sw{background:var(--navy)}.on .sw::after{transform:translateX(18px)}
.radio{position:absolute;top:24px;right:24px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:#fff;transition:all .3s var(--spring)}
.on .radio{border:7px solid var(--navy)}
.pcard .radio{top:calc(var(--pad) + 2px);right:var(--pad)}
.pcard.sel .radio{border:7px solid var(--navy)}
.pcard:hover:not(.sel) .radio{border-color:var(--navy)}
.pcard .p-top{padding-right:36px}
.acard.photo{padding:0;overflow:hidden;flex-direction:row;align-items:stretch;gap:0}
.acard.photo .ph{flex:none;width:36%;min-height:200px;position:relative;overflow:hidden;background:radial-gradient(80% 80% at 50% 100%,#fbe0c9,var(--cream))}
.acard.photo .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;transition:transform .8s var(--ease)}
.acard.photo.on .ph img{transform:scale(1.05)}
.acard.photo .bd{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;min-width:0;flex:1}
.more{margin-top:12px}
.resolve{margin-top:var(--gap);border-radius:20px;padding:16px 20px;font-size:15.5px;background:var(--card)}
.resolve.pop{animation:viewIn .45s var(--ease) both}
.resolve svg{display:none}
.resolve.bad{background:var(--warn-soft)}
.resolve .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.resolve .btn{padding:8px 14px;font-size:15px}

/* ================= ORDER ================= */
.order{display:grid;gap:10px}
.oline{background:var(--card);border-radius:20px}
.oline summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:18px 24px;align-items:center;font-weight:600}
.oline summary::-webkit-details-marker{display:none}
.oline summary small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.oline .mono{white-space:nowrap}
.oline .b{padding:0 24px 18px;columns:2 220px;column-gap:24px;font-size:15px;color:var(--muted)}
.oline .b div{break-inside:avoid;padding:3px 0}
.sum-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.sum-row .price{padding:0}
.form{margin-top:30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
@media (max-width:760px){ .form{grid-template-columns:minmax(0,1fr)} }
.fld{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--muted)}
.fld input{font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:16px;padding:15px 18px;transition:border-color .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(32,63,140,.12)}
.fld.err input{border-color:var(--err)}
.fld .e{color:var(--err);font-size:13.5px;min-height:16px}
.consents{display:grid;gap:10px;margin-top:6px;font-size:15.5px;color:var(--muted)}
.consents label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.consents input{width:18px;height:18px;accent-color:var(--orange);margin-top:2px;flex:none}
.consents a{color:var(--blue)}
.notice{margin-top:16px;font-size:15px;color:var(--muted)}
.notice svg{display:none}
.pay-btn{width:100%;max-width:560px;margin-top:26px;font-size:18px;font-weight:600}
.pay-btn .pay-ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;transition:background .3s}
.pay-btn .pay-ic svg{width:20px;height:20px;padding:0;background:none}
.pay-btn.locked{opacity:.55}
.pay-btn.busy{pointer-events:none}
.pay-btn.done{background:var(--ok);border-color:var(--ok)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ================= RESULT ================= */
.res{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:30px;align-items:start;background:var(--card);border-radius:var(--r);padding:var(--pad)}
@media (max-width:760px){ .res{grid-template-columns:minmax(0,1fr)} }
.res .h2{font-size:clamp(26px,2.2vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.res .lead{font-size:17px;margin-top:10px}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:var(--gap);font-size:14px;color:var(--muted)}
.status{display:inline-flex;gap:8px;align-items:center;font-size:15px;font-weight:700}
.status.ok{color:var(--ok)}.status.wait{color:var(--ink)}.status.bad{color:var(--orange)}
.status svg{width:16px;height:16px}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.steps-after{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.steps-after li{display:flex;gap:12px;font-size:16px}
.steps-after li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--cream);color:var(--orange);display:grid;place-items:center;font-size:13.5px}
.printer{width:100%;max-width:300px;margin:0 auto;position:relative}
.housing{position:relative;z-index:2;height:60px;border-radius:20px 20px 14px 14px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13.5px}
.housing b{font-family:var(--f-mono);letter-spacing:.2em;font-size:13px}
.housing span{color:var(--muted);display:flex;gap:6px;align-items:center}
.housing span i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.housing.busy span i{background:var(--orange);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.3}}
.housing::after{content:"";position:absolute;left:26px;right:26px;bottom:8px;height:5px;border-radius:5px;background:var(--navy)}
.feed{position:relative;z-index:1;margin:-12px auto 0;width:252px;overflow:hidden;padding-bottom:20px}
.paper{background:#fff;color:var(--ink);font-family:var(--f-mono);font-size:11.5px;line-height:16px;padding:22px 16px 26px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.14));-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%}
.paper .c{text-align:center}.paper .m{font-weight:600;letter-spacing:.2em;font-size:12.5px}.paper .dim{color:#7a7a82}
.paper .r{display:flex;justify-content:space-between;gap:8px}.paper .tot{font-size:13.5px;font-weight:600}
.paper .bar{display:flex;gap:1px;height:30px;justify-content:center;margin:10px 0 6px}.paper .bar i{background:var(--ink);display:block}
.reprint{display:block;margin:6px auto 0}
.loader{width:56px;height:56px;margin:10px 0 18px;position:relative}
.loader i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:sp 1s linear infinite}
.loader i:nth-child(2){inset:10px;border-top-color:var(--navy);animation-duration:1.6s;animation-direction:reverse}

/* ================= overlays ================= */
.mbar{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20;display:none;pointer-events:none}
@media (max-width:1100px){ .mbar.show{display:block} }
.mbar-in{pointer-events:auto;max-width:560px;margin:0 auto;background:linear-gradient(170deg,#24479a,var(--navy));color:#fff;border-radius:24px;box-shadow:0 20px 50px -20px rgba(14,36,87,.7);overflow:hidden}
.mbar-head{width:100%;background:none;border:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;color:inherit}
.mbar-head .lft{display:flex;align-items:center;gap:10px;font-size:16px}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--orange);color:#fff;font-size:13.5px;font-weight:600;display:grid;place-items:center}
.mbar-head .roll{font-size:22px}
.mbar-head svg{width:18px;height:18px;transition:transform .35s var(--ease)}
.mbar.open .mbar-head svg{transform:rotate(180deg)}
.mbar-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.mbar.open .mbar-body{grid-template-rows:1fr}
.mbar-body>div{overflow:hidden}
.mbar-body .lines{padding:0 20px 14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px) scale(.9);opacity:0;background:var(--navy);color:#fff;padding:10px 18px 10px 12px;border-radius:999px;font-size:15px;display:flex;gap:10px;align-items:center;z-index:50;transition:all .5s var(--spring);pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 14px 40px -14px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%);opacity:1}
.toast i{width:22px;height:22px;border-radius:50%;background:var(--orange);display:grid;place-items:center;flex:none}
.toast svg{width:13px;height:13px;color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(20,24,40,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;background:var(--card);display:flex;flex-direction:column;transition:transform .5s var(--spring);top:12px;right:12px;bottom:12px;width:min(460px,calc(100% - 24px));border-radius:28px;transform:translateX(110%);box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.sheet.wide{width:min(840px,calc(100% - 24px))}
.sheet.show{transform:none}
@media (max-width:640px){ .sheet,.sheet.wide{top:auto;left:0;right:0;bottom:0;width:100%;max-height:86vh;border-radius:24px 24px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)} .sheet.show{transform:none} }
.sheet-h{padding:24px 24px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:21px;font-weight:700}
.sheet-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.x{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.sheet-b{overflow-y:auto;padding:8px 24px 24px}
.grp{margin-top:16px}
.grp h5{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.12s!important}}
</style>

// ---------- rolling number: NumberFlow (number-flow.barvian.me, MIT), как в «Бегущих цифрах» из First saas ----------
// Библиотека грузится модулем внизу страницы; до её загрузки сумма показывается текстом.
const NF_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
function setRoll(el, value){
  el._val = value;
  el.setAttribute('aria-label', rub(value));
  let f = el.querySelector('number-flow');
  if (!f){
    if (!window.__NF){ el.textContent = rub(value); return; }
    el.textContent = '';
    f = document.createElement('number-flow');
    f.locales = 'ru-RU';
    f.format = { style:'currency', currency:'RUB', maximumFractionDigits:0 };
    const timing = { duration: 900, easing: window.__NF.defaultProps.transformTiming.easing || NF_EASE };
    f.transformTiming = timing; f.spinTiming = timing;
    f.style.setProperty('--number-flow-mask-height', '0.12em');
    el.appendChild(f);
    f.animated = false; f.update(value); f.animated = true;
    return;
  }
  f.update(value);
}
window.addEventListener('nf-ready', () => document.querySelectorAll('.roll').forEach(el => { if (el._val != null) setRoll(el, el._val); }));

function compareRows(diffOnly){

let printRAF;
function printReceipt(){
  const paper = document.getElementById('paper'), feed = document.getElementById('feed'), housing = document.getElementById('housing');
  if (!paper) return;
  cancelAnimationFrame(printRAF);
  const H = paper.offsetHeight; feed.style.height = (H + 20) + 'px';
  let pos = -H, target = -H, wait = 250, last = performance.now();
  housing.classList.add('busy'); document.getElementById('pStatus').textContent = 'Печать…';
  function done(){ housing.classList.remove('busy'); housing.style.transform='none'; document.getElementById('pStatus').textContent = 'Готово'; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ paper.style.transform = 'none'; done(); return; }
  function frame(now){
    const dt = Math.min(50, now - last); last = now; wait -= dt;
    if (wait <= 0 && target < 0){ target = Math.min(0, target + 15); wait = 55 + Math.random()*50; }
    pos += (target - pos) * Math.min(1, dt/1000 * 34);
    paper.style.transform = `translateY(${pos}px)`;
    housing.style.transform = target < 0 ? `translateX(${Math.sin(now/18)*0.5}px)` : 'none';
    if (target >= 0 && Math.abs(pos) < 0.3){ paper.style.transform = 'none'; done(); return; }
    printRAF = requestAnimationFrame(frame);
  }
  paper.style.transform = `translateY(${-H}px)`;
  printRAF = requestAnimationFrame(frame);
}

function phoneMask(v){
  let d = v.replace(/\D/g,''); if (d.startsWith('8')) d = '7' + d.slice(1); if (d && !d.startsWith('7')) d = '7' + d; d = d.slice(0,11);
  if (!d) return '';
  const p = [d.slice(1,4), d.slice(4,7), d.slice(7,9), d.slice(9,11)];
  let s = '+7'; if (p[0]) s += ' (' + p[0]; if (p[0].length === 3) s += ')'; if (p[1]) s += ' ' + p[1]; if (p[2]) s += '-' + p[2]; if (p[3]) s += '-' + p[3];

}

  const prev = S.level; if (prev === id) return;
  S.level = id;
  if (prev && (S.gender || S.themes.size)) toast('Состав и стоимость дополнений обновлены для выбранной программы');
  render(false);
}
function navBind(){
  stage.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (!b.disabled) go(+b.dataset.go); });
  document.querySelectorAll('#asideActions [data-go]').forEach(b => b.onclick = () => { if (!b.disabled) go(+b.dataset.go); });
  stage.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => go(1));
}
const bind = {
  0(){ stage.querySelectorAll('[data-who]').forEach(b => b.onclick = () => { S.who = b.dataset.who; S.showOtherGender = false; go(1); }); },
  1(){
    stage.querySelectorAll('.pcard').forEach(c => {
      const pick = () => { const id = c.dataset.level; setLevel(id); const n = stage.querySelector(`[data-level="${id}"]`); n && n.focus({preventScroll:true}); };
      c.onclick = e => { if (!e.target.closest('[data-comp]')) pick(); };
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    });
    stage.querySelectorAll('[data-comp]').forEach(b => b.onclick = () => { const l = LV.find(x=>x.id===b.dataset.comp); openSheet('Программа «' + l.name + '»', D.programs[l.id].length + ' услуг · ' + rub(PRICE.base[l.id]), D.programs[l.id]); });
    const cmp = document.getElementById('cmp'); cmp.ontoggle = () => S.cmpOpen = cmp.open;
    document.getElementById('diffOnly').onchange = e => { S.diffOnly = e.target.checked; render(false); };
    navBind();
  },
  2(){
    placeSeg();
    stage.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => setLevel(b.dataset.seg));
    stage.querySelectorAll('.acard').forEach(c => {
      const flip = () => {
        const id = c.dataset.addon;
        if (c.dataset.kind === 'gender') S.gender = S.gender === id ? null : id;
        else S.themes.has(id) ? S.themes.delete(id) : S.themes.add(id);
        render(false);
        const again = stage.querySelector(`[data-addon="${id}"]`); again && again.focus({preventScroll:true});
      };
      c.onclick = e => { if (!e.target.closest('[data-acomp]')) flip(); };
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
    });
    stage.querySelectorAll('[data-acomp]').forEach(b => b.onclick = () => { const id = b.dataset.acomp; openSheet(AD[id].name, 'к ' + LVN[S.level] + ' · ' + D.addons[id][S.level].length + ' услуг · ' + rub(PRICE[id][S.level]), D.addons[id][S.level]); });
    stage.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => {
      const [act, k] = b.dataset.fix.split(':');
      if (act === 'add') S.themes.add(k);
      if (act === 'only') S.themes = new Set([k]);
      if (act === 'drop') S.themes.delete(k);
      render(false);
    });
    const og = document.getElementById('otherG'); if (og) og.onclick = () => { S.showOtherGender = true; render(false); };
    navBind();
  },
  3(){
    const f = S.form;
    const nm = document.getElementById('f-name'), ph = document.getElementById('f-phone'), em = document.getElementById('f-email');
    nm.oninput = () => { f.name = nm.value; window.__slideLabel(); };
    ph.oninput = () => { ph.value = phoneMask(ph.value); f.phone = ph.value; window.__slideLabel(); };
    em.oninput = () => { f.email = em.value.trim(); window.__slideLabel(); };
    document.getElementById('f-c1').onchange = e => { f.c1 = e.target.checked; window.__slideLabel(); };
    document.getElementById('f-c2').onchange = e => { f.c2 = e.target.checked; window.__slideLabel(); };
    document.getElementById('form').onsubmit = e => e.preventDefault();
    bindSlide(); navBind();
  },
  4(){
    placeSeg();
    document.getElementById('paySeg').querySelectorAll('[data-pay]').forEach(x => x.onclick = () => { S.pay = x.dataset.pay; render(false); });
    if (S.pay === 'paid'){ requestAnimationFrame(printReceipt); document.getElementById('reprint').onclick = printReceipt; }
    navBind();
  }
};
// кнопки, перенесённые в остров, получают обработчики после dockActions
const _dock = dockActions;
dockActions = function(){ _dock(); navBind(); };
addEventListener('resize', placeSeg);
document.fonts && document.fonts.ready.then(placeSeg);
render(true);
</script>
<script type="module">
import NumberFlow from 'https://esm.sh/number-flow@0.6.2';
window.__NF = NumberFlow;
window.dispatchEvent(new Event('nf-ready'));
</script>
